name: Build Paduka Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: floppy-unity
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev \
            libncurses5-dev python3 build-essential zip \
            clang lld llvm llvm-dev

      - name: Load and fix defconfig
        run: |
          DEFCONFIG=$(find arch/arm64/configs/ -name "*ginkgo*" \
            -o -name "*trinket*" -o -name "*floppy*" \
            -o -name "*willow*" 2>/dev/null | head -1 | xargs basename)
          echo "Using defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 $DEFCONFIG
          yes "" | make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 oldconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            KBUILD_BUILD_USER=Rozialvaro_ \
            KBUILD_BUILD_HOST=PadukaKernel \
            Image.gz-dtb dtbo.img

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: Paduka-Kernel-ginkgo
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
          retention-days: 7
